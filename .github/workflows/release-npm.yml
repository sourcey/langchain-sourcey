name: Release npm package

# Pushing a js/vX.Y.Z tag publishes the JavaScript package at that version to
# npm. The package trusts this workflow through npm trusted publishing, so no
# npm token is stored here.

on:
  push:
    tags:
      - "js/v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    defaults:
      run:
        working-directory: js

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "js/v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -qF "langchain-sourcey-js/$version\"" src/retriever.ts; then
            echo "src/retriever.ts User-Agent is not langchain-sourcey-js/$version" >&2
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Run JS type checks
        run: npm run check

      - name: Run JS tests
        run: npm run test

      - name: Run JS live integration test
        run: SOURCEY_TEST_SITE_URL=https://sourcey.com/docs npm run test

      - name: Build JS package
        run: npm run build

      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#js/v}"
          if npm view "langchain-sourcey@$version" version >/dev/null 2>&1; then
            echo "langchain-sourcey@$version is already on npm"
            exit 0
          fi
          npm publish --access public
